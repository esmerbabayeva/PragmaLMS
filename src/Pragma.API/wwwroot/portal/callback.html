<!DOCTYPE html>
<html lang="az" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragma LMS — Doğrulanır...</title>

    <!-- Favicon & Apple Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-neutral-50 dark:bg-[#0a0a0c] text-neutral-900 dark:text-neutral-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-sm w-full bg-white dark:bg-[#131316] border border-neutral-200 dark:border-neutral-800 rounded-3xl p-8 text-center space-y-4 shadow-xl">
        <div id="spinner" class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <h2 id="statusTitle" class="text-lg font-bold">Giriş kodu yoxlanılır...</h2>
        <p id="statusDesc" class="text-xs text-neutral-500 dark:text-neutral-400">Zəhmət olmasa gözləyin, sistemə yönləndirilirsiniz.</p>
        <div id="retryBtn" class="hidden pt-2">
            <a href="/portal/login.html" class="inline-block px-4 py-2 text-xs font-semibold rounded-xl bg-indigo-600 text-white">Giriş səhifəsinə qayıt</a>
        </div>
    </div>

    <script>
        (async function() {
            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');
            const code = params.get('code');

            if (!email || !code) {
                showError("Keçid linkində email və ya təsdiq kodu çatışmır.");
                return;
            }

            try {
                const res = await fetch('/api/v1/auth/passwordless/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, code: code })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('pragma-token', data.accessToken);
                    localStorage.setItem('pragma-user-id', data.user?.id || '');
                    localStorage.setItem('pragma-user-email', data.user?.email || '');
                    localStorage.setItem('pragma-user-fullname', data.user?.fullName || '');
                    localStorage.setItem('pragma-user-roles', JSON.stringify(data.user?.roles || []));
                    sessionStorage.setItem('pragma_token', data.accessToken);
                    sessionStorage.setItem('pragma_user_id', data.user?.id || '');
                    sessionStorage.setItem('pragma_user', JSON.stringify(data.user));

                    document.getElementById('statusTitle').innerText = "Giriş uğurludur!";
                    document.getElementById('statusDesc').innerText = "Müvafiq kabinetə yönləndirilirsiniz...";
                    
                    const roles = data.user?.roles || [];
                    setTimeout(() => {
                        if (roles.includes('Admin')) {
                            window.location.href = '/portal/index.html?view=admin';
                        } else if (roles.includes('Instructor')) {
                            window.location.href = '/portal/index.html?view=instructor';
                        } else if (roles.includes('Teacher')) {
                            window.location.href = '/portal/index.html?view=teacher';
                        } else {
                            window.location.href = '/portal/index.html?view=dashboard';
                        }
                    }, 500);
                } else {
                    showError(data.detail || "Giriş kodu yanlışdır və ya vaxtı bitib.");
                }
            } catch (err) {
                showError("Şəbəkə xətası baş verdi.");
            }

            function showError(msg) {
                document.getElementById('spinner').classList.add('hidden');
                document.getElementById('statusTitle').innerText = "Xəta baş verdi";
                document.getElementById('statusTitle').classList.add('text-red-500');
                document.getElementById('statusDesc').innerText = msg;
                document.getElementById('retryBtn').classList.remove('hidden');
            }
        })();
    </script>
</body>
</html>
