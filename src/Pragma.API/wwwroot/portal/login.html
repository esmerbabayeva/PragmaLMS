<!DOCTYPE html>
<html lang="az" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragma LMS — Giriş</title>

    <!-- Favicon & Apple Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-neutral-50 dark:bg-[#0a0a0c] text-neutral-900 dark:text-neutral-100 min-h-screen flex items-center justify-center p-4" x-data="loginApp()" x-init="init()">

    <div class="w-full max-w-md bg-white dark:bg-[#131316] border border-neutral-200 dark:border-neutral-800 rounded-3xl p-8 shadow-2xl space-y-6">
        
        <!-- Logo & Header -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-blue-50/80 dark:bg-blue-950/50 border border-blue-100 dark:border-blue-800/60 p-2.5 flex items-center justify-center mx-auto shadow-md">
                <img src="/images/logo.png" alt="Pragma LMS" class="w-full h-full object-contain select-none" />
            </div>
            <div class="flex items-center justify-center gap-2 pt-1">
                <h1 class="text-2xl font-black tracking-tight text-neutral-900 dark:text-white">PRAGMA</h1>
                <span class="text-xs font-mono font-bold text-sky-600 bg-sky-50 border border-sky-200 dark:text-cyan-400 dark:bg-cyan-950/60 dark:border-cyan-800/80 px-2 py-0.5 rounded leading-none">LMS</span>
            </div>
            <p class="text-xs text-neutral-500 dark:text-neutral-400">Gələcəyin mühəndislik platformasına daxil olun</p>
        </div>

        <!-- Alert / Toast Message -->
        <div x-show="message" x-cloak x-transition class="p-3 rounded-xl text-xs font-semibold flex items-center gap-2"
             :class="isError ? 'bg-red-500/10 border border-red-500/20 text-red-500' : 'bg-emerald-500/10 border border-emerald-500/20 text-emerald-500'">
            <span x-text="isError ? '⚠️' : '✅'"></span>
            <span x-text="message"></span>
        </div>

        <!-- 1. GOOGLE SIGN-IN -->
        <div class="space-y-3">
            <div id="googleBtnContainer" class="flex justify-center w-full min-h-[44px]"></div>
            
            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-neutral-200 dark:border-neutral-800"></div>
                <span class="flex-shrink mx-3 text-[11px] font-mono uppercase text-neutral-400 dark:text-neutral-500">və ya</span>
                <div class="flex-grow border-t border-neutral-200 dark:border-neutral-800"></div>
            </div>
        </div>

        <!-- 2. PASSWORDLESS EMAIL OTP LOGIN -->
        <div class="space-y-4">
            <div x-show="step === 1" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-neutral-600 dark:text-neutral-300 mb-1.5">E-poçt ünvanınız</label>
                    <input type="email" x-model="email" placeholder="adiniz@example.com"
                           class="w-full px-4 py-3 text-sm rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-[#1a1a1e] text-neutral-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button @click="requestOtp()" :disabled="loading || !email"
                        class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-semibold text-sm shadow-md shadow-indigo-600/20 transition flex items-center justify-center gap-2 cursor-pointer">
                    <span x-show="loading" class="animate-spin text-sm" style="display: none;">⏳</span>
                    <span>Təsdiq Kodu Göndər (OTP)</span>
                </button>
            </div>

            <!-- OTP Code Step -->
            <div x-show="step === 2" x-cloak class="space-y-3">
                <div class="text-center space-y-1">
                    <p class="text-xs text-neutral-500 dark:text-neutral-400">
                        <strong x-text="email" class="text-indigo-400"></strong> ünvanına 6-rəqəmli təsdiq kodu göndərildi.
                    </p>
                </div>
                <div>
                    <label class="block text-xs font-medium text-neutral-600 dark:text-neutral-300 mb-1.5 text-center">6 Rəqəmli Təsdiq Kodu</label>
                    <input type="text" maxlength="6" x-model="otpCode" placeholder="123456"
                           class="w-full px-4 py-3 text-center text-xl font-bold mono tracking-widest rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-[#1a1a1e] text-neutral-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button @click="verifyOtp()" :disabled="loading || otpCode.length !== 6"
                        class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-semibold text-sm shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2 cursor-pointer">
                    <span x-show="loading" class="animate-spin text-sm" style="display: none;">⏳</span>
                    <span>Kodu Təsdiqlə və Daxil Ol</span>
                </button>
                <div class="flex items-center justify-between text-xs pt-1">
                    <button @click="step = 1" class="text-neutral-400 hover:text-white transition">← E-poçtu dəyiş</button>
                    <span x-show="resendTimer > 0" class="text-neutral-500 mono" x-text="resendTimer + 's gözləyin'"></span>
                    <button x-show="resendTimer === 0" @click="requestOtp()" class="text-indigo-400 hover:underline">Yenidən göndər</button>
                </div>
            </div>
        </div>

        <!-- 3. COLLAPSIBLE PASSWORD LOGIN -->
        <div class="border-t border-neutral-200 dark:border-neutral-800 pt-4">
            <button @click="showPassword = !showPassword" class="w-full flex items-center justify-between text-xs text-neutral-500 hover:text-neutral-800 dark:hover:text-neutral-300 font-medium transition py-1">
                <span>Ənənəvi Şifrə ilə Giriş</span>
                <span x-text="showPassword ? '▲' : '▼'"></span>
            </button>

            <div x-show="showPassword" x-cloak x-transition class="space-y-3 pt-3" x-data="{ revealPassword: false }">
                <input type="email" x-model="passwordEmail" placeholder="Email"
                       class="w-full px-3 py-2 text-xs rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-[#1a1a1e] text-neutral-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                <div class="relative">
                    <input :type="revealPassword ? 'text' : 'password'" x-model="passwordValue" placeholder="Şifrə"
                           class="w-full px-3 py-2 pr-10 text-xs rounded-xl border border-neutral-300 dark:border-neutral-700 bg-neutral-50 dark:bg-[#1a1a1e] text-neutral-900 dark:text-white focus:outline-none focus:border-indigo-500 transition">
                    <button type="button" @click="revealPassword = !revealPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-neutral-400 hover:text-neutral-600 dark:hover:text-neutral-200 cursor-pointer focus:outline-none" :title="revealPassword ? 'Şifrəni gizlət' : 'Şifrəni göstər'">
                        <svg x-show="!revealPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        <svg x-show="revealPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display: none;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                    </button>
                </div>
                <button @click="loginWithPassword()" :disabled="loading || !passwordEmail || !passwordValue"
                        class="w-full py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-white font-semibold text-xs transition cursor-pointer">
                    Şifrə ilə Daxil Ol
                </button>
            </div>
        </div>

        <!-- 4. QUICK TEST LOGINS -->
        <div class="pt-2 text-center space-y-2">
            <span class="text-[10px] font-mono uppercase text-neutral-400">1-Klik Test Hesabları</span>
            <div class="grid grid-cols-3 gap-2">
                <button @click="quickLogin('student@pragma.edu.az', 'Password123!')" class="py-1.5 px-2 text-[11px] font-medium rounded-lg bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 border border-blue-500/20 transition">🎓 Tələbə</button>
                <button @click="quickLogin('teacher@pragma.edu.az', 'Password123!')" class="py-1.5 px-2 text-[11px] font-medium rounded-lg bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20 border border-emerald-500/20 transition">👨‍🏫 Müəllim</button>
                <button @click="quickLogin('admin@pragma.edu.az', 'PragmaAdmin2026!')" class="py-1.5 px-2 text-[11px] font-medium rounded-lg bg-purple-500/10 text-purple-400 hover:bg-purple-500/20 border border-purple-500/20 transition">🛡️ Admin</button>
            </div>
        </div>

    </div>

    <script>
        function loginApp() {
            return {
                step: 1,
                email: '',
                otpCode: '',
                passwordEmail: '',
                passwordValue: '',
                showPassword: false,
                loading: false,
                message: '',
                isError: false,
                resendTimer: 0,
                timerInterval: null,

                init() {
                    const params = new URLSearchParams(window.location.search);
                    if (params.has('email')) {
                        this.email = params.get('email');
                    }
                    if (params.has('code')) {
                        this.otpCode = params.get('code');
                        this.step = 2;
                        this.verifyOtp();
                    }

                    this.initGoogleSignIn();
                },

                initGoogleSignIn() {
                    const clientId = 'YOUR_GOOGLE_CLIENT_ID'; // user-secrets və ya frontend config
                    if (window.google && window.google.accounts) {
                        try {
                            google.accounts.id.initialize({
                                client_id: clientId,
                                callback: (response) => this.handleGoogleCredential(response)
                            });

                            const container = document.getElementById('googleBtnContainer');
                            if (container) {
                                google.accounts.id.renderButton(container, {
                                    theme: 'filled_black',
                                    size: 'large',
                                    shape: 'pill',
                                    width: 380,
                                    text: 'continue_with'
                                });
                            }

                            google.accounts.id.prompt();
                        } catch (e) {
                            console.log('Google Auth initialized in standby mode.');
                        }
                    }
                },

                saveAndRedirect(data) {
                    localStorage.setItem('pragma-token', data.accessToken);
                    localStorage.setItem('pragma-user-id', data.user?.id || '');
                    localStorage.setItem('pragma-user-email', data.user?.email || '');
                    localStorage.setItem('pragma-user-fullname', data.user?.fullName || '');
                    localStorage.setItem('pragma-user-roles', JSON.stringify(data.user?.roles || []));
                    sessionStorage.setItem('pragma_token', data.accessToken);
                    sessionStorage.setItem('pragma_user_id', data.user?.id || '');
                    sessionStorage.setItem('pragma_user', JSON.stringify(data.user));

                    const roles = data.user?.roles || [];
                    if (roles.includes('Admin')) {
                        window.location.href = 'http://localhost:5089';
                    } else if (roles.includes('Instructor')) {
                        window.location.href = '/portal/index.html?view=instructor';
                    } else if (roles.includes('Teacher')) {
                        window.location.href = '/portal/index.html?view=teacher';
                    } else {
                        window.location.href = '/portal/index.html?view=dashboard';
                    }
                },

                async handleGoogleCredential(response) {
                    this.loading = true;
                    this.message = 'Google hesabı təsdiqlənir...';
                    this.isError = false;

                    try {
                        const res = await fetch('/api/v1/auth/google', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ idToken: response.credential })
                        });

                        const data = await res.json();
                        if (res.ok) {
                            this.saveAndRedirect(data);
                        } else {
                            this.isError = true;
                            this.message = data.detail || 'Google ilə giriş uğursuz oldu.';
                        }
                    } catch (err) {
                        this.isError = true;
                        this.message = 'Şəbəkə xətası baş verdi.';
                    } finally {
                        this.loading = false;
                    }
                },

                async requestOtp() {
                    if (!this.email) return;
                    this.loading = true;
                    this.message = '';
                    this.isError = false;

                    try {
                        const res = await fetch('/api/v1/auth/passwordless/request', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.email })
                        });

                        if (res.status === 202 || res.ok) {
                            this.step = 2;
                            this.startResendTimer();
                            this.message = 'Birdəfəlik kod e-poçtunuza göndərildi.';
                        } else {
                            const data = await res.json();
                            this.isError = true;
                            this.message = data.detail || 'Xəta baş verdi.';
                        }
                    } catch (e) {
                        this.isError = true;
                        this.message = 'Şəbəkə əlaqəsi qurulmadı.';
                    } finally {
                        this.loading = false;
                    }
                },

                async verifyOtp() {
                    if (this.otpCode.length !== 6) return;
                    this.loading = true;
                    this.message = '';
                    this.isError = false;

                    try {
                        const res = await fetch('/api/v1/auth/passwordless/verify', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.email, code: this.otpCode })
                        });

                        const data = await res.json();
                        if (res.ok) {
                            this.message = 'Giriş uğurludur! Yönləndirilirsiniz...';
                            setTimeout(() => { this.saveAndRedirect(data); }, 500);
                        } else {
                            this.isError = true;
                            this.message = data.detail || 'Təsdiq kodu yanlışdır.';
                        }
                    } catch (e) {
                        this.isError = true;
                        this.message = 'Şəbəkə xətası baş verdi.';
                    } finally {
                        this.loading = false;
                    }
                },

                async loginWithPassword() {
                    this.loading = true;
                    this.message = '';
                    this.isError = false;

                    try {
                        const res = await fetch('/api/v1/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: this.passwordEmail, password: this.passwordValue })
                        });

                        const data = await res.json();
                        if (res.ok) {
                            this.saveAndRedirect(data);
                        } else {
                            this.isError = true;
                            this.message = data.detail || 'Email və ya şifrə yanlışdır.';
                        }
                    } catch (e) {
                        this.isError = true;
                        this.message = 'Şəbəkə xətası baş verdi.';
                    } finally {
                        this.loading = false;
                    }
                },

                quickLogin(email, password) {
                    this.passwordEmail = email;
                    this.passwordValue = password;
                    this.showPassword = true;
                    this.loginWithPassword();
                },

                startResendTimer() {
                    this.resendTimer = 60;
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        this.resendTimer--;
                        if (this.resendTimer <= 0) {
                            clearInterval(this.timerInterval);
                        }
                    }, 1000);
                }
            }
        }
    </script>
</body>
</html>
